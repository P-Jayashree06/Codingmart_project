services:
  mysql:
    image: mysql:8.0
    container_name: bloodbank-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: bloodbank
      MYSQL_USER: bloodbank
      MYSQL_PASSWORD: bloodbank
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  backend:
    build: .
    container_name: bloodbank-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/bloodbank?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USERNAME: bloodbank
      DB_PASSWORD: bloodbank
      JWT_SECRET: "${JWT_SECRET:-change-me-dev-only-secret-key-at-least-32-bytes-long}"
    ports:
      - "8080:8080"
volumes:
  mysql-data:
