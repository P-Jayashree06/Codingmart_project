server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: blood-bank
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bloodbank?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:bloodbank}
    password: ${DB_PASSWORD:bloodbank}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
bloodbank:
  shelfLifeDays: 42
  donationGapDays: 90
  minAge: 18
  maxAge: 65
  minWeightKg: 50
  minVolumeMl: 300
  maxVolumeMl: 500
  maxUnitsPerRequest: 10
  lowStockThreshold: 10
  nearExpiryDays: 7
  nearExpiryAlertDays: 3
  duplicateWindowMinutes: 10
  jwt:
    secret: ${JWT_SECRET:change-me-dev-only-secret-key-at-least-32-bytes-long}
    expirySeconds: 3600
